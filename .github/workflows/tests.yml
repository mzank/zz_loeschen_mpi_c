name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure CMake
        run: |
          cmake --preset default

      - name: Build
        run: |
          cmake --build --preset default \
            --parallel

      - name: Run tests
        run: |
          ctest --preset default
